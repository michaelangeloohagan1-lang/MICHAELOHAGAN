<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VANS ON THE WALL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            color: white;
            background:
                radial-gradient(circle at top, #581c87, transparent 45%),
                linear-gradient(135deg, #10051f, #30104c);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 25px;
            text-align: center;
            background: linear-gradient(160deg, #29113f, #180925);
            border: 1px solid #9333ea;
            box-shadow: 0 0 35px #a855f755;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #f5d0fe;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #c4b5fd;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #e9d5ff;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid #7e22ce;
            outline: none;
            background: #10051f;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #e879f9;
            box-shadow: 0 0 12px #a855f755;
        }

        input::placeholder {
            color: #a78bba;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #d8b4fe;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 5px 0 25px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #d8b4fe;
            font-weight: normal;
            margin: 0;
        }

        .remember input {
            accent-color: #c026d3;
        }

        a {
            color: #f0abfc;
            text-decoration: none;
        }

        a:hover {
            color: white;
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #7c3aed, #c026d3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #a855f766;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 28px #c084fc;
        }

        .message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
            color: #fca5a5;
        }

        .extra-links {
            margin-top: 22px;
            color: #c4b5fd;
            font-size: 14px;
            line-height: 2;
        }

        .navigation {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #7e22ce;
            font-size: 12px;
        }

        .back-home {
            display: inline-block;
            margin-top: 22px;
            color: #d8b4fe;
            font-size: 13px;
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .options {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo" aria-hidden="true"></div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Vans on the Wall<br>
            OFF THE WALL, ON THE WALL
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        SHOW
                    </button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="contact.html">Forgot pascsword?</a>
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

            <p
                class="message"
                id="message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <div class="extra-links">
            <p>Don't have an account?</p>
            <a href="register.html">Create an account</a>
            <br>
            <a href="homepage.html">Continue as guest</a>
        </div>

        <nav class="navigation" aria-label="Main navigation">
            
            <a href="homepage.html">homepage</a>
            <a href="product.html">product</a>
            <a href="About.html">about</a>
            <a href="contact.html">contact</a>
        </nav>

        <a href="homepage.html" class="back-home">
            &#8592; Back to Home
        </a>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        // Show or hide the password
        togglePassword.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "HIDE" : "SHOW";
            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        });

        // Demo login credentials
        const correctUsername = "michael";
        const correctPassword = "123456789";

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document
                .getElementById("username")
                .value.trim();

            const password = passwordInput.value;

            if (
                username === correctUsername &&
                password === correctPassword
            ) {
                message.style.color = "#86efac";
                message.textContent = "Login successful! Welcome back.";

                // Open homepage after successful demo login
                window.location.href = "homepage.html";
            } else {
                message.style.color = "#fca5a5";
                message.textContent =
                    "Incorrect username or password. Please try again.";
            }
        });
    </script>

</body>
</html>
